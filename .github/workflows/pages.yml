# Publica la aplicación web (solo la carpeta src/) en GitHub Pages.
# Hito 4 — permisos mínimos y acciones fijadas por commit (SHA).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Por defecto, ningún permiso; cada job pide solo lo que necesita
permissions: {}

# Una sola publicación a la vez; no se cancela una que ya está en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Empaquetar solo src/
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publicar en Pages
      id-token: write   # autenticación OIDC que exige deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
